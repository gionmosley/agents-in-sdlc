<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instant Regrets Banner</title>
<style>
  @font-face { font-family: "Poppins"; font-weight: 500; src: url("fonts/poppins-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: url("fonts/poppins-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 800; src: url("fonts/poppins-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Roboto"; font-weight: 500; src: url("fonts/roboto-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; font-weight: 400; src: url("fonts/anton-latin-400-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #090909; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="banner" xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440"></svg>
<script>
/*
 * INSTANT REGRETS: YouTube banner (2560 x 1440), built from the channel's own Shorts design:
 * black panel, white Poppins "instant regrets." wordmark with the red header rule, Anton headline
 * with the last words in gold, the paper-bag mascot, THE FACTS block, WAIT. / 0.5x SLOW-MO tags,
 * the torn edge, and the crossed-out "regrets" channel logo.
 * Safe area for text/logo on every device: 1546 x 423, centred.
 *
 * URL options: ?guides=1                  draw the desktop / tablet / safe-area boxes
 *              ?transparent=1&only=main   centre row only (used to measure safe-area margins)
 */
const params = new URLSearchParams(location.search);
const W = 2560, H = 1440, CX = 1280, CY = 720;
const BAND = { top: 508.5, bottom: 931.5 };
const SAFE = { left: 507, right: 2053 };
const TABLET = { left: 352.5, right: 2207.5 };
const C = { bg: '#090909', white: '#FFFFFF', gold: '#E0AD38', red: '#D01F27', strip: '#161616', pattern: '#212121', tagBg: '#0B0B0B' };

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
const ctx = document.createElement('canvas').getContext('2d');
function measure(text, size, family, weight = 400) {
  ctx.font = `${weight} ${size}px "${family}"`;
  return ctx.measureText(text);
}
const svg = document.getElementById('banner');

/* ---------- brand pieces, as used in the Shorts ---------- */
// "instant regrets." : Poppins ExtraBold + Poppins Medium at 0.36x, sitting on instant's x-height
const TRACK = -0.035;   // em, "instant" is set tight in the Shorts header
function wordmark(g, x, baseline, size, color = C.white) {
  const xh = measure('n', size, 'Poppins', 800).actualBoundingBoxAscent;
  const iw = measure('instant', size, 'Poppins', 800).width + 6 * TRACK * size;
  const rs = regretsSize(xh), gap = xh * 0.36, rb = baseline - xh * 0.3;
  el('text', { x, y: baseline, 'font-family': 'Poppins', 'font-weight': 800, 'font-size': size, 'letter-spacing': (TRACK * size).toFixed(2), fill: color, text: 'instant' }, g);
  el('text', { x: x + iw + gap, y: rb, 'font-family': 'Roboto', 'font-weight': 500, 'font-size': rs, fill: color, text: 'regrets.' }, g);
  const rw = measure('regrets.', rs, 'Roboto', 500).width;
  return { width: iw + gap + rw, ascent: measure('instant', size, 'Poppins', 800).actualBoundingBoxAscent, xh };
}
// "regrets." is Roboto Medium with an x-height 0.364x that of "instant" (measured from the Shorts header)
function regretsSize(xh) { return 0.364 * xh / (measure('n', 100, 'Roboto', 500).actualBoundingBoxAscent / 100); }
function wordmarkWidth(size) {
  const xh = measure('n', size, 'Poppins', 800).actualBoundingBoxAscent;
  return measure('instant', size, 'Poppins', 800).width + 6 * TRACK * size + xh * 0.36 + measure('regrets.', regretsSize(xh), 'Roboto', 500).width;
}
// plain rectangular caption tags (WAIT. / 0.5x SLOW-MO)
function tag(g, x, y, text, size, fill, color, padX = 0.32, padY = 0.22) {
  const m = measure(text, size, 'Anton'), cap = measure('H', size, 'Anton').actualBoundingBoxAscent;
  const w = m.width + size * padX * 2, h = cap + size * padY * 2;
  el('rect', { x, y, width: w, height: h, fill }, g);
  el('text', { x: x + size * padX, y: y + size * padY + cap, 'font-family': 'Anton', 'font-size': size, fill: color, 'xml:space': 'preserve', text }, g);
  return { w, h };
}
// torn edge between "video" and the black panel
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function tornPanel(g, edgeY, dir, seed, far, s = 2.2) {
  // black panel on the far side of edgeY; dir = -1 spikes point up, +1 spikes point down
  const r = rng(seed), pts = [];
  for (let x = -40; x < W + 40;) {
    const w = (12 + r() * 30) * s, peak = (r() < 0.3 ? 3 + r() * 6 : 9 + r() * 20) * s;
    pts.push([x, edgeY + dir * -(r() * 3 * s)]);
    pts.push([x + w * (0.3 + r() * 0.4), edgeY + dir * peak]);
    x += w;
  }
  pts.push([W + 40, edgeY], [W + 40, far], [-40, far]);
  el('polygon', { points: pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' '), fill: C.bg }, g);
}
function patternStrip(g, y0, y1) {
  el('rect', { x: 0, y: y0, width: W, height: y1 - y0, fill: C.strip }, g);
  const pg = el('g', {}, g);
  for (let row = 0, y = y0 + 70; y < y1 + 40; row++, y += 96) {
    for (let x = -260 + (row % 2) * 250; x < W; x += 500) wordmark(pg, x, y, 58, C.pattern);
  }
}

/* ---------- layout ---------- */
function drawTV(g) {
  // top: a "video" strip with the Shorts overlay tags, torn into the black panel
  patternStrip(g, 0, 470);
  const w1 = measure('WAIT.', 64, 'Anton').width + 64 * 0.64;
  tag(g, CX - w1 / 2, 150, 'WAIT.', 64, C.red, C.white);
  const w2 = measure('0.5x  SLOW-MO', 52, 'Anton').width + 52 * 0.64;
  tag(g, W - 150 - w2, 90, '0.5x  SLOW-MO', 52, C.tagBg, C.gold);
  tornPanel(g, 440, -1, 7, 990);
  // bottom: the same tear, mirrored
  patternStrip(g, 975, H);
  tornPanel(g, 1000, 1, 11, 470);
}

function drawEdges(g) {
  // left (desktop only, clear of the tablet crop): THE FACTS, straight from the Shorts panel
  const fx = 86, fy = 612;
  el('text', { x: fx, y: fy, 'font-family': 'Anton', 'font-size': 50, fill: C.gold, text: 'THE FACTS' }, g);
  el('rect', { x: fx, y: fy + 14, width: measure('THE FACTS', 50, 'Anton').width, height: 6, fill: C.red }, g);
  [['New Shorts?', C.white], ['Every day.', C.gold], ['Anyone hurt?', C.white], ['Nobody seriously.', C.gold]]
    .forEach(([t, col], i) => el('text', { x: fx, y: fy + 72 + i * 38 + (i > 1 ? 16 : 0), 'font-family': 'Poppins', 'font-weight': 600, 'font-size': 27, fill: col, text: t }, g));
  // right (desktop only): the channel logo + "Daily YouTube Shorts"
  const lw = 248, lh = lw * 151 / 516, lx = TABLET.right + 30, ly = 648;
  el('image', { href: 'assets/regrets-logo.png', x: lx, y: ly, width: lw, height: lh }, g);
  const sz = 23.5, y = ly + lh + 54;
  const a = measure('Daily ', sz, 'Poppins', 500).width, b = measure('YouTube', sz, 'Poppins', 800).width;
  const sw = measure('Shorts', sz, 'Poppins', 800).width + 14, total = a + b + 6 + sw;
  const sx = lx + lw / 2 - total / 2;
  el('text', { x: sx, y, 'font-family': 'Poppins', 'font-weight': 500, 'font-size': sz, fill: C.white, text: 'Daily' }, g);
  el('text', { x: sx + a, y, 'font-family': 'Poppins', 'font-weight': 800, 'font-size': sz, fill: C.white, text: 'YouTube' }, g);
  el('rect', { x: sx + a + b + 6, y: y - sz * 0.86, width: sw, height: sz * 1.12, fill: C.red }, g);
  el('text', { x: sx + a + b + 13, y, 'font-family': 'Poppins', 'font-weight': 800, 'font-size': sz, fill: C.white, text: 'Shorts' }, g);
}

function drawMain(g) {
  const left = SAFE.left + 48;
  // mascot: right end of the safe area, standing on the bottom of the band like in the Shorts panel
  const mW = 400, mH = 469, personRight = 351, bagTop = 19;
  const mx = SAFE.right - 34 - personRight, my = BAND.top + 34 - bagTop;
  // wordmark fills the space up to the mascot
  const avail = mx + 35 - 64 - left;
  const size = avail / (wordmarkWidth(100) / 100);
  const tag1 = measure('THAT SPLIT SECOND BETWEEN “WATCH THIS” AND “OH NO.”', 100, 'Anton');
  const tSize = avail / (tag1.width / 100);
  const tCap = measure('H', tSize, 'Anton').actualBoundingBoxAscent;
  const asc = measure('instant', size, 'Poppins', 800).actualBoundingBoxAscent;
  const gap1 = 30, rule = 9, gap2 = 34;
  const blockH = asc + gap1 + rule + gap2 + tCap;
  const top = CY - blockH / 2 + 2;
  const base = top + asc;
  const wm = wordmark(g, left, base, size);
  el('rect', { x: left + 4, y: base + gap1, width: wm.width - 4, height: rule, fill: C.red }, g);
  const t = el('text', { x: left + 2, y: base + gap1 + rule + gap2 + tCap, 'font-family': 'Anton', 'font-size': tSize, 'xml:space': 'preserve' }, g);
  el('tspan', { fill: C.white, text: 'THAT SPLIT SECOND BETWEEN “WATCH THIS” AND ' }, t);
  el('tspan', { fill: C.gold, text: '“OH NO.”' }, t);
  el('image', { href: 'assets/mascot.png', x: mx, y: my, width: mW, height: mH }, g);
}

function drawGuides(g) {
  const z = (x, w, col, label) => {
    el('rect', { x, y: BAND.top, width: w, height: BAND.bottom - BAND.top, fill: 'none', stroke: col, 'stroke-width': 4, 'stroke-dasharray': '18 10' }, g);
    el('text', { x: x + 10, y: BAND.top - 12, 'font-family': 'Anton', 'font-size': 30, fill: col, text: label }, g);
  };
  z(0, W, '#00FF88', 'DESKTOP 2560x423');
  z(TABLET.left, TABLET.right - TABLET.left, '#FFA500', 'TABLET 1855x423');
  z(SAFE.left, SAFE.right - SAFE.left, '#FF2D55', 'SAFE 1546x423');
}

function build() {
  if (params.get('transparent')) document.documentElement.style.background = document.body.style.background = 'transparent';
  else el('rect', { width: W, height: H, fill: C.bg }, svg);
  if (!params.get('only')) {
    drawTV(el('g', { id: 'tv' }, svg));
    drawEdges(el('g', { id: 'desktop-edges' }, svg));
  }
  drawMain(el('g', { id: 'main' }, svg));
  if (params.get('guides')) drawGuides(el('g', { id: 'guides' }, svg));
}

Promise.all([['Poppins', 500], ['Poppins', 600], ['Poppins', 800], ['Roboto', 500], ['Anton', 400]].map(([f, w]) => document.fonts.load(`${w} 100px "${f}"`)))
  .then(() => new Promise(res => {
    const imgs = ['assets/mascot.png', 'assets/regrets-logo.png'].map(src => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = src; }));
    Promise.all(imgs).then(res);
  }))
  .then(build)
  .then(() => new Promise(r => setTimeout(r, 50)))
  .then(() => { window.__ready = true; });
</script>
</body>
</html>
